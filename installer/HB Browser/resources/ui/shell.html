<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>HB Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="shell">
  <div id="titlebar">
    <div id="tabs" role="tablist"></div>
    <button id="newtab" class="icon-btn" data-icon="plus" data-i18n-title="newTab"></button>
    <div id="drag"></div>
    <div id="winctl">
      <button id="wmin" data-icon="minimize" data-size="16" data-i18n-title="minimize"></button>
      <button id="wmax" data-icon="maximize" data-size="15" data-i18n-title="maximize"></button>
      <button id="wclose" data-icon="close" data-size="17" data-i18n-title="close"></button>
    </div>
  </div>
  <div id="toolbar">
    <button id="back" class="icon-btn" data-icon="back" data-i18n-title="back"></button>
    <button id="forward" class="icon-btn" data-icon="forward" data-i18n-title="forward"></button>
    <button id="reload" class="icon-btn" data-icon="reload" data-i18n-title="reload"></button>
    <button id="home" class="icon-btn" data-icon="home" data-i18n-title="home"></button>
    <div id="omni">
      <button id="sec" class="icon-btn" tabindex="-1"></button>
      <input id="url" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="omniPlaceholder">
      <button id="star" class="icon-btn" data-icon="star" data-i18n-title="bookmarkThis"></button>
    </div>
    <span id="privateBadge" hidden></span>
    <button id="dlbtn" class="icon-btn" data-opens data-icon="download" data-i18n-title="downloads"></button>
    <button id="menubtn" class="icon-btn" data-opens data-icon="menu" data-i18n-title="menu"></button>
  </div>
  <div id="bmbar"></div>
</div>

<div id="suggest" class="popup" hidden></div>
<div id="menu" class="popup" hidden></div>
<div id="ctx" class="popup" hidden></div>
<div id="folder" class="popup" hidden></div>
<div id="dlpop" class="popup" hidden></div>
<div id="find" class="popup" hidden>
  <input id="findInput" type="text" data-i18n-ph="findPlaceholder" spellcheck="false">
  <span id="findCount" class="muted"></span>
  <button id="findCase" class="icon-btn" data-icon="case" data-i18n-title="caseSensitive"></button>
  <button id="findPrev" class="icon-btn" data-icon="back" data-i18n-title="prev" style="transform:rotate(90deg)"></button>
  <button id="findNext" class="icon-btn" data-icon="back" data-i18n-title="next" style="transform:rotate(-90deg)"></button>
  <button id="findClose" class="icon-btn" data-icon="close" data-i18n-title="close"></button>
</div>
<div id="toast" class="popup" hidden></div>

<script src="../shared/icons.js"></script>
<script src="../shared/bridge.js"></script>
<script src="../shared/i18n.js"></script>
<script src="shell.js"></script>
</body>
</html>
